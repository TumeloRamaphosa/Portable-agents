<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c0d" />
  <title>StudEx OS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0c0d;
      --ink: #f4f0e6;
      --muted: #b7b1a6;
      --gold: #c9a84c;
      --gold-ink: #1a1408;
      --line: rgba(201, 168, 76, 0.28);
      --line-strong: rgba(201, 168, 76, 0.5);
      --panel: #161618;
      --panel-2: #101012;
      --danger: #e0a090;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      --radius: 14px;
      --ui: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --mono: "Space Mono", "SF Mono", ui-monospace, monospace;
      --serif: "Cormorant Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 16px;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:active { transform: scale(0.98); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    a { color: var(--gold); }
    h1, h2, p { margin: 0; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .os {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background:
        radial-gradient(900px 420px at 8% -10%, rgba(201, 168, 76, 0.16), transparent 62%),
        var(--bg);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
      z-index: 5;
    }
    .brand {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      font-family: var(--serif);
      font-size: 28px;
      line-height: 1;
      letter-spacing: 0.01em;
      color: var(--gold);
    }
    .menu-app {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .menu-spacer { flex: 1; }
    .menu-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .pill, .text-btn, .gold-btn, .dock-btn, .lane-btn, .chip {
      border-radius: 999px;
    }
    .pill {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .pill.live { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
    .clock {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink);
      white-space: nowrap;
    }
    .about {
      position: absolute;
      top: calc(52px + env(safe-area-inset-top));
      left: 12px;
      width: min(420px, calc(100vw - 24px));
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      box-shadow: var(--shadow);
      z-index: 6;
    }
    .about p { color: var(--muted); margin-top: 8px; }
    .about .gold-btn { margin-top: 14px; }

    .stage {
      min-height: 0;
      padding: 22px 22px 12px;
    }
    .window, .launcher {
      width: min(1080px, 100%);
      height: 100%;
      margin: 0 auto;
    }
    .window {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), var(--shadow);
      overflow: hidden;
    }
    .window-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #141416;
    }
    .window-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .window-bar .menu-spacer { flex: 1; }
    .text-btn, .gold-btn, .lane-btn, .chip {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--gold);
      min-height: 36px;
      padding: 0 14px;
    }
    .gold-btn {
      background: var(--gold);
      color: var(--gold-ink);
      border-color: var(--gold);
      font-weight: 650;
    }
    .gold-btn:disabled, .text-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .window-body {
      min-height: 0;
      overflow: auto;
      padding: 18px 18px 28px;
      overscroll-behavior: contain;
    }

    .lede { max-width: 62ch; color: var(--muted); }
    .lede strong { color: var(--ink); font-weight: 600; }
    .stack { display: grid; gap: 18px; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    h2 {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 2px 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(201, 168, 76, 0.16);
    }
    .row:last-child { border-bottom: 0; }
    .row p, .quiet { color: var(--muted); }
    .name { font-weight: 650; }
    .mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
    .mono a { overflow-wrap: anywhere; }
    .state { font-family: var(--mono); font-size: 12px; color: var(--gold); }
    .state.bad { color: var(--danger); }
    .state.quiet { color: var(--muted); }
    .links { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .links a { font-family: var(--mono); font-size: 13px; }

    .banner {
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #1c1a16;
    }
    .banner p { margin-top: 6px; color: var(--muted); }
    .banner code, .about code, .hint code {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink);
    }

    .lanes { display: flex; gap: 8px; flex-wrap: wrap; }
    .lane-btn[aria-pressed="true"], .chip[aria-pressed="true"] {
      background: var(--gold);
      color: var(--gold-ink);
      border-color: var(--gold);
    }
    .field { display: grid; gap: 6px; }
    .field span { color: var(--muted); font-size: 14px; }
    select, input[type="search"], textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      background: #101012;
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 44px;
    }
    textarea { min-height: 96px; resize: vertical; }
    select:focus, input:focus, textarea:focus { border-color: var(--gold); }
    .reply {
      white-space: pre-wrap;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      min-height: 1.4em;
    }
    .hint { color: var(--muted); font-size: 14px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filters input { max-width: 280px; }

    .launcher {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 180px));
      gap: 18px;
      align-content: center;
      justify-content: center;
    }
    .tile {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: rgba(22, 22, 24, 0.92);
      color: var(--ink);
      border-radius: 16px;
      min-height: 120px;
      display: grid;
      align-content: end;
      justify-items: start;
      padding: 14px;
      text-align: left;
    }
    .mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--gold);
      color: var(--gold-ink);
      font-family: var(--mono);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .dock {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .dock-inner {
      display: flex;
      gap: 4px;
      padding: 6px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .dock-btn {
      appearance: none;
      width: 76px;
      min-height: 58px;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      border-radius: 12px;
    }
    .dock-btn[aria-current="page"] {
      color: var(--gold-ink);
      background: var(--gold);
    }
    .dock-btn .mark {
      width: 22px;
      height: 22px;
      margin: 0;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font-size: 12px;
      border: 1px solid currentColor;
    }
    .dock-btn[aria-current="page"] .mark {
      background: var(--gold-ink);
      color: var(--gold);
      border-color: var(--gold-ink);
    }
    .dock-btn span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; white-space: nowrap; }

    @media (max-width: 760px) {
      .menu-app, .pill.route, .clock-zone { display: none; }
      .stage { padding: 0; }
      .window {
        width: 100%;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .close-btn { display: none; }
      .split { grid-template-columns: 1fr; gap: 22px; }
      .window-body { padding: 16px 16px 24px; }
      .dock { padding-left: 0; padding-right: 0; }
      .dock-inner {
        width: 100%;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        justify-content: space-between;
      }
      .dock-btn { width: auto; flex: 1; }
      .hint-keys { display: none; }
      .filters input { max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      .os, .menu, .window, .dock-inner, .tile { background: #101012; }
    }
  </style>
</head>

    </header>
    <main class="stage" id="stage"></main>

    const state = {
      app: "roof",
      company: null,
      open: true,
      about: false,
      bridge: "checking",
      live: null,
      lane: localStorage.getItem("studex-os-lane") === "online" ? "online" : "offline",

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      Object.entries(attrs || {}).forEach(function (entry) {
        const key = entry[0];
        const value = entry[1];
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2).toLowerCase(), value);
        else if (value != null && value !== false) node.setAttribute(key, value === true ? "" : String(value));
      });
      (children || []).forEach(function (child) {
        node.append(child instanceof Node ? child : document.createTextNode(String(child)));
      });
      return node;
    }

    function data() {
      return state.live || CAPTURE;
    }

    function seenText(peer) {
      if (peer.seen) return peer.seen;
      if (peer.online) return "On the mesh";
      const iso = peer.lastSeen || "";
      const stamp = Date.parse(iso);
      if (!iso || iso.indexOf("0001") === 0 || Number.isNaN(stamp)) return "Last seen unknown";
      const days = Math.floor((Date.now() - stamp) / 86400000);
      if (days <= 0) return "Last seen today";
      if (days === 1) return "Last seen yesterday";
      return "Last seen " + days + " days ago";
    }

    function peers() {
      return ((data().tailscale || {}).peers || []).slice().sort(function (a, b) {
        return (b.self - a.self) || (b.online - a.online) || a.name.localeCompare(b.name);
      });
    }

    function selfPeer() {
      return peers().find(function (peer) { return peer.self; }) || peers()[0] || null;
    }

    function onlineCount() {
      return peers().filter(function (peer) { return peer.online; }).length;
    }

    function portUp(port) {
      const ports = data().ports || {};
      return Boolean(ports[String(port)]);
    }

    function listeningSeats() {
      return LOCAL_SEATS.filter(function (seat) { return portUp(seat[2]); });
    }

    function silentSeats() {
      return LOCAL_SEATS.filter(function (seat) { return !portUp(seat[2]); });
    }

    function offlineModels() {
      return ((data().ollama || {}).models || []).filter(function (model) { return model.name; });
    }

    function gb(size) {
      if (!size) return "";
      return (size / 1e9).toFixed(2) + " GB";
    }

    function routeLabel() {
      if (state.lane === "online") return "Online · " + (state.model || "unset");
      return "Offline · " + (state.model || "unset");
    }

    function log(line) {
      state.log.unshift(line);
      state.log = state.log.slice(0, 12);
    }

    function rememberRoute() {
      const choices = state.lane === "online"
        ? ONLINE.map(function (item) { return item[0]; })
        : offlineModels().map(function (model) { return model.name; });
      if (choices.length && choices.indexOf(state.model) === -1) state.model = choices[0];
      localStorage.setItem("studex-os-lane", state.lane);
      localStorage.setItem("studex-os-model", state.model);
    }

      body.append(el("p", { class: "lede", text: routerUp
        ? "LiteLLM is answering on port 4000. This page still does not send prompts to cloud models."
        : "Offline weights run on this Mac. Online routes are named in LiteLLM. Port 4000 did not answer, and this page does not hold provider keys." }));

      const lanes = el("div", { class: "lanes", role: "group", "aria-label": "Route lane" });
      [["offline", "Offline house"], ["online", "Online routes"]].forEach(function (item) {
        lanes.append(el("button", {
          class: "lane-btn",
          type: "button",
          "aria-pressed": state.lane === item[0] ? "true" : "false",
          onClick: function () {
            state.lane = item[0];
            rememberRoute();
            paint(true);
          }
        }, [item[1]]));
      });
      body.append(lanes);

      const picker = el("label", { class: "field" }, [el("span", { text: "Active route" })]);
      const select = el("select", {
        id: "route-select",
        onChange: function (event) {
          state.model = event.target.value;
          rememberRoute();
          paintChrome();
        }
      });
      if (state.lane === "offline") {
        offlineModels().forEach(function (model) {
          const option = el("option", { value: model.name, text: model.name });
          if (model.name === state.model) option.selected = true;
          select.append(option);
        });
        if (!offlineModels().length) select.append(el("option", { text: "No local weight", value: "" }));
      } else {
        ONLINE.forEach(function (item) {
          const option = el("option", { value: item[0], text: item[0] + "  " + item[1] });
          if (item[0] === state.model) option.selected = true;
          select.append(option);
        });
      }
      picker.append(select);
      body.append(picker);

      if (state.lane === "offline") {
        const list = el("section", {}, [el("h2", { text: "Installed on this Mac" })]);
        offlineModels().forEach(function (model) {
          list.append(row(model.name, [model.params, gb(model.size)].filter(Boolean).join("  "), model.name === state.model ? "Active" : "Installed", false));
        });
        list.append(el("p", { class: "quiet", text: "The router also names code-fast (qwen2.5-coder:7b), LM Studio weights on port 1234, and two Ollama cloud tags. Those were not installed or not listening." }));
        body.append(list);
        if (state.model === "qwen2.5:14b") {
          body.append(el("p", { class: "hint", text: "qwen2.5:14b is about 9 GB. The first reply can take a while." }));
        }
      } else {
        const list = el("section", {}, [el("h2", { text: "Configured online routes" })]);
        ONLINE.forEach(function (item) {
          list.append(row(item[0], item[1] + "  " + item[2], routerUp ? "Router up" : "Router silent", !routerUp));
        });
        body.append(list);
      }
      body.append(el("button", { class: "text-btn", type: "button", onClick: function () { go("console"); } }, ["Open console"]));
    }

    function renderTailnet(body) {
      const ts = data().tailscale || {};
      body.append(el("p", { class: "lede", text: ts.ok
        ? "Tailscale backend " + (ts.backend || "Running") + ". Client " + (ts.client || "unknown") + ", server " + (ts.version || "unknown") + "."
        : "Tailscale did not answer on this reading." }));
      const clientVersion = String(ts.client || "").split("-")[0];
      const serverVersion = String(ts.version || "").split("-")[0];
      if (clientVersion && serverVersion && clientVersion !== serverVersion) {
        body.append(el("p", { class: "hint", text: "Client and server versions differ. The mesh is still up when the backend is Running." }));
      }

      const filters = el("div", { class: "filters" });
      [["all", "All"], ["online", "On mesh"]].forEach(function (item) {
        filters.append(el("button", {
          class: "chip",
          type: "button",
          "aria-pressed": state.mesh === item[0] ? "true" : "false",
          onClick: function () {
            state.mesh = item[0];
            paint(true);
          }
        }, [item[1]]));
      });
      const search = el("input", {
        type: "search",
        placeholder: "Search name or address",
        value: state.query,
        "aria-label": "Search machines",
        onInput: function (event) {
          state.query = event.target.value;
          paintList();
        }
      });
      filters.append(search);
      body.append(filters);
      body.append(el("div", { id: "peer-list" }));
      paintList();
    }

    function paintList() {
      const host = document.getElementById("peer-list");
      if (!host) return;
      const needle = state.query.trim().toLowerCase();
      const list = peers().filter(function (peer) {
        if (state.mesh === "online" && !peer.online) return false;
        if (!needle) return true;
        return (peer.name + " " + peer.ip + " " + peer.os).toLowerCase().indexOf(needle) !== -1;
      });
      host.replaceChildren();
      if (!list.length) {
        host.append(el("p", { class: "quiet", text: "No machine matches." }));
        return;
      }
      list.forEach(function (peer) {
        const line = el("div", { class: "row" });
        const copy = el("div", {}, [
          el("div", { class: "name", text: peer.name + (peer.self ? "  (this Mac)" : "") }),
          el("p", { class: "mono", text: (peer.os || "unknown") + "  " + (peer.ip || "no address") })
        ]);
        const side = el("div", {}, [
          el("div", { class: peer.online ? "state" : "state bad", text: seenText(peer) })
        ]);
        if (peer.ip) {
          side.append(el("button", {
            class: "text-btn",
            type: "button",
            style: "margin-top:6px",
            onClick: function () { copyIp(peer.ip); }
          }, [state.copied === peer.ip ? "Copied" : "Copy"]));
        }
        line.append(copy, side);
        host.append(line);
      });
    }

    function copyIp(ip) {
      const done = function () {
        state.copied = ip;
        paintList();
        setTimeout(function () {
          if (state.copied === ip) {
            state.copied = "";
            paintList();
          }
        }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ip).then(done).catch(function () {
          window.prompt("Copy this address", ip);
        });
      } else {
        window.prompt("Copy this address", ip);
      }
    }

    function renderConsole(body) {
      body.append(el("p", { class: "lede", text: "The console runs a weight that is already on this Mac. Online routes are not sent from the browser." }));
      const logBox = el("section", {}, [el("h2", { text: "Desk log" })]);
      state.log.forEach(function (line) {
        logBox.append(el("p", { class: "mono quiet", text: line }));
      });
      body.append(logBox);

      if (state.lane === "online") {
        body.append(el("div", { class: "banner" }, [
          el("strong", { text: "Active route is online: " + state.model }),
          el("p", { text: portUp(4000)
            ? "LiteLLM is up on port 4000. Ask it from the machine that holds the keys. This page will not forward the prompt."
            : "LiteLLM on port 4000 did not answer. This page will not forward the prompt." })
        ]));
        return;
      }

      const form = el("form", { class: "stack", onSubmit: ask });
      const picker = el("label", { class: "field" }, [el("span", { text: "Local weight" })]);
      const select = el("select", { name: "model" });
      offlineModels().forEach(function (model) {
        const option = el("option", { value: model.name, text: model.name });
        if (model.name === state.model) option.selected = true;
        select.append(option);
      });
      picker.append(select);
      const area = el("textarea", {
        name: "prompt",
        required: "true",
        maxlength: "2000",
        onInput: function (event) { state.draft = event.target.value; }
      });
      area.value = state.draft;
      const prompt = el("label", { class: "field" }, [
        el("span", { text: "Prompt" }),
        area
      ]);
      form.append(picker, prompt, el("button", {
        class: "gold-btn",
        type: "submit",
        disabled: state.bridge !== "up" || state.asking || !offlineModels().length
      }, [state.asking ? "Running on this Mac" : "Run on this Mac"]));
      if (state.bridge !== "up") {
        form.append(el("p", { class: "hint", text: "Start the desk bridge before a local run." }));
      }
      form.append(el("p", { class: "hint hint-keys", text: "Ctrl or Command and Enter runs it." }));
      const reply = el("div", { class: "reply", id: "reply", "aria-live": "polite" });
      if (state.askError) reply.append(el("p", { class: "state bad", text: state.askError }));
      else if (state.answer) reply.textContent = state.answer;
      else reply.append(el("p", { class: "quiet", text: "The reply lands here." }));
      form.append(reply);
      area.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          if (typeof form.requestSubmit === "function") form.requestSubmit();
        }
      });
      body.append(form);
    }

    function ask(event) {
      event.preventDefault();
      if (state.bridge !== "up" || state.asking) return;
      const form = event.currentTarget;
      const model = form.model.value;
      const prompt = form.prompt.value.trim();
      if (!prompt) return;
      state.model = model;
      state.draft = prompt;
      rememberRoute();
      state.asking = true;
      state.answer = "";
      state.askError = "";
      paint(true);
      fetch(BRIDGE + "/v1/complete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: model, prompt: prompt })
      }).then(function (response) {
        return response.json().then(function (body) {
          if (!response.ok || !body.ok) throw new Error(body.error || "The local model did not answer.");
          const seconds = body.total_ms ? "  " + (body.total_ms / 1000).toFixed(1) + "s" : "";
          state.answer = body.text || "(empty reply)";
          state.draft = "";
          log(model + " answered." + seconds);
        });
      }).catch(function (error) {
        state.askError = error.message || "The local model did not answer.";
        log(state.askError);
      }).finally(function () {
        state.asking = false;
        paint(true);
      });
    }

    function renderAbout() {
      const existing = document.getElementById("about");
      if (!state.about) {
        if (existing) existing.remove();
        document.getElementById("brand").setAttribute("aria-expanded", "false");
        return;
      }
      if (existing) existing.remove();
      const panel = el("div", { class: "about", id: "about", role: "dialog", "aria-label": "About this desk" }, [
        el("h2", { text: "About this desk" }),
        el("p", { text: "StudEx OS is the roof for the companies. Each company opens as its own room, with its own files, agents, and repos. Drive folders are links only. This page does not open their contents. Herdr, OpenRig, Orgo, and the GCP VMs stay on the shared fleet. Offline weights run on Ollama. Online routes stay named in LiteLLM. Tailscale is read from the local client. Keys are not in this page." }),
        el("p", {}, [el("code", { text: "python3 ~/Desktop/studex-os-bridge.py" })]),
        el("button", { class: "gold-btn", type: "button", onClick: function () { state.about = false; refresh(); } }, ["Refresh"])
      ]);
      document.querySelector(".os").append(panel);
      document.getElementById("brand").setAttribute("aria-expanded", "true");
    }

    function paintChrome() {
      const currentCompany = state.company ? companyById(state.company) : null;
      document.getElementById("menu-app").textContent = currentCompany ? currentCompany.name : APPS.find(function (app) { return app[0] === state.app; })[1];
      const pill = document.getElementById("source-pill");
      pill.textContent = state.bridge === "up" ? "Live" : (state.bridge === "checking" ? "Checking" : "Capture");
      pill.classList.toggle("live", state.bridge === "up");
      document.getElementById("route-pill").textContent = routeLabel();
      const now = new Date();
      const time = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      const zone = now.toLocaleTimeString("en-GB", { timeZoneName: "short" }).split(" ").pop();
      const clock = document.getElementById("clock");
      clock.replaceChildren(document.createTextNode(time + " "), el("span", { class: "clock-zone", text: zone }));
      const dock = document.getElementById("dock");
      dock.replaceChildren();
      APPS.forEach(function (app) {
        dock.append(el("button", {
          class: "dock-btn",
          type: "button",
          "aria-current": state.app === app[0] && state.open ? "page" : null,
          onClick: function () { go(app[0]); }
        }, [el("span", { class: "mark", text: app[2] }), el("span", { text: app[1] })]));
      });
      renderAbout();
    }

    function paint(force) {
      const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      paintChrome();
      if (typing && !force) return;
      const stage = document.getElementById("stage");
      const scroller = document.querySelector(".window-body");
      const top = scroller ? scroller.scrollTop : 0;
      stage.replaceChildren();
      if (!state.open) {
        const launcher = el("div", { class: "launcher" });
        APPS.forEach(function (app) {
          launcher.append(el("button", { class: "tile", type: "button", onClick: function () { go(app[0]); } }, [
            el("span", { class: "mark", text: app[2] }),
            el("strong", { text: app[1] })
          ]));
        });
        stage.append(launcher);
        return;
      }
      const titles = { roof: "Companies", fleet: "Fleet", tools: "Tools", models: "Models", console: "Console" };
      const current = state.company ? companyById(state.company) : null;
      const title = current ? current.name : (titles[state.app] || "StudEx OS");
      const win = el("section", { class: "window", "aria-label": title });
      const bar = el("div", { class: "window-bar" }, [
        el("h1", { class: "window-title", text: title })
      ]);
      if (current) {
        bar.append(el("button", {
          class: "text-btn",
          type: "button",
          onClick: function () { state.company = null; paint(true); }
        }, ["All companies"]));
      }
      bar.append(el("div", { class: "menu-spacer" }));
      bar.append(el("button", { class: "text-btn close-btn", type: "button", onClick: function () { state.open = false; state.company = null; paint(true); } }, ["Close"]));
      const body = el("div", { class: "window-body stack" });
      if (state.app === "roof") renderRoof(body);
      else if (state.app === "fleet") renderFleet(body);
      else if (state.app === "tools") renderTools(body);
      else if (state.app === "models") renderModels(body);
      else renderConsole(body);
      win.append(bar, body);
      stage.append(win);
      const next = document.querySelector(".window-body");
      if (next) next.scrollTop = top;
    }

    function refresh() {
      const controller = new AbortController();
      const timer = setTimeout(function () { controller.abort(); }, 5000);
      fetch(BRIDGE + "/v1/desk", { cache: "no-store", signal: controller.signal })
        .then(function (response) {
          if (!response.ok) throw new Error("Bridge answered " + response.status);
          return response.json();
        })
        .then(function (payload) {
          const was = state.bridge;
          state.live = payload;
          state.bridge = "up";
          rememberRoute();
          if (was !== "up") log("Desk bridge is live.");
        })
        .catch(function () {
          const was = state.bridge;
          state.live = null;
          state.bridge = "down";
          if (was !== "down") log("Desk bridge did not answer. Showing the 1 Oct 2026 capture.");
        })
        .finally(function () {
          clearTimeout(timer);
          paint(false);
        });
    }

    document.getElementById("brand").addEventListener("click", function () {
      state.about = !state.about;
      renderAbout();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        if (state.about) {
          state.about = false;
          renderAbout();
          return;
        }
        if (state.company) {
          state.company = null;
          paint(true);
        }
      }
      if (event.target && /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
      const index = Number(event.key) - 1;
      if (index >= 0 && index < APPS.length) go(APPS[index][0]);
    });
    document.addEventListener("click", function (event) {
      if (!state.about) return;
      const about = document.getElementById("about");
      if (about && !about.contains(event.target) && event.target.id !== "brand") {
        state.about = false;
        renderAbout();
      }
    });

    rememberRoute();
    paint(true);
    refresh();
    setInterval(function () {
      const now = new Date();
      const time = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      const zone = now.toLocaleTimeString("en-GB", { timeZoneName: "short" }).split(" ").pop();
      const clock = document.getElementById("clock");
      if (clock) clock.replaceChildren(document.createTextNode(time + " "), el("span", { class: "clock-zone", text: zone }));
    }, 1000);
    setInterval(refresh, 20000);
  </script>
</body>
</html>
